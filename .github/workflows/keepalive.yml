name: Keep Supabase awake

# Free Supabase projects go to sleep after a week without use. This pokes the
# database twice a week so it's awake when you get to class. It only reads
# (and with row level security, a logged-out read returns nothing at all).

on:
  schedule:
    - cron: '17 9 * * 1,4' # Mondays and Thursdays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY repo variables aren't set; nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            "$URL/rest/v1/lessons?select=id&limit=1" \
            -H "apikey: $KEY"
          echo
          echo "Supabase is awake."
